name: Publish the game

on:
  push:
    branches: [main]
    paths: ["web/**", "tools/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Bundle the wallet selector
        run: cd tools && npm install --no-audit --no-fund && npm ls @hot-labs/near-connect && node bundle.mjs
      - name: Smoke test in a real browser
        continue-on-error: true
        run: |
          cd tools && npx playwright install --with-deps chromium >/dev/null
          (cd ../web && python3 -m http.server 8000 >/dev/null 2>&1 &) && sleep 1
          node smoke.mjs http://localhost:8000/
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke, path: tools/smoke-connect.png, if-no-files-found: ignore }
      - name: Cache-bust the page's files
        run: sed -i "s#src=\"app.js\"#src=\"app.js?v=${GITHUB_SHA::7}\"#; s#href=\"style.css\"#href=\"style.css?v=${GITHUB_SHA::7}\"#" web/index.html && grep -n '?v=' web/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: deployment
        uses: actions/deploy-pages@v4
